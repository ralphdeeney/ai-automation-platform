name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --requirement apps/api/requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: apps/api
        run: python -m pytest apps/api/tests infra/docker/tests
      - name: Validate Compose model
        env:
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        run: docker compose -f infra/docker/compose.yaml config --quiet
